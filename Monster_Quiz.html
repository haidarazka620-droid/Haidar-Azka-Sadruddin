<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Monster Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: single-column RPG shell, max 980px; arena on top, quiz card below; menu and map as card grids. */
:root{
  --bg:#17132f; --bg2:#221b47; --panel:#2b2358; --panel2:#3a2f70; --line:#54479c;
  --ink:#f5f1ff; --muted:#bcb3e2; --gold:#ffcf5c; --gold2:#ff9f45;
  --hp:#ff5470; --hpok:#4fe3a0; --mana:#6cc4ff; --bad:#ff6b81; --good:#4fe3a0;
  --ipa:#4fd1c5; --ips:#ffb86b; --mtk:#b79cff;
  --font-d:"Lilita One","Trebuchet MS",system-ui,sans-serif;
  --font-b:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;font-family:var(--font-b);font-size:16px;line-height:1.45;color:var(--ink);
  background-color:var(--bg);
  background-image:radial-gradient(900px 500px at 85% -10%,#3b2a7a55,transparent 60%),radial-gradient(700px 420px at -10% 110%,#1f5a7a40,transparent 60%);
  padding-block:12px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:980px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--mana);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);font-weight:400;letter-spacing:.02em;margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;border:0;border-radius:14px;padding:13px 18px;font-family:var(--font-d);font-size:1.05rem;letter-spacing:.03em;
  background:linear-gradient(180deg,var(--gold),var(--gold2));color:#3a1f00;box-shadow:0 4px 0 #b9651f,0 8px 16px #0006;
  transition:transform .08s,box-shadow .08s,filter .15s}
.btn:active:not(:disabled){transform:translateY(3px) scale(.97);box-shadow:0 1px 0 #b9651f,0 3px 8px #0006}
.btn.ghost:active:not(:disabled){box-shadow:0 1px 0 #1b1440,0 3px 8px #0005}
.btn.danger:active:not(:disabled){box-shadow:0 1px 0 #8f1f36,0 3px 8px #0006}
.btn .ic{flex:none;width:1.15em;height:1.15em}
@media(hover:hover) and (pointer:fine){.btn:hover:not(:disabled){transform:translateY(-2px) scale(1.02);filter:brightness(1.07)}.tab:hover{border-color:var(--mana)}.node.open:hover{transform:translateY(-3px)}}
.tab,.node,.sk,.tg{transition:transform .12s ease,border-color .15s,background .15s}
.tab:active,.node.open:active,.sk:active:not(:disabled){transform:scale(.95)}
.dot{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--hp);color:#fff;border:2px solid var(--bg);font-style:normal;font-family:var(--font-b);font-weight:800;font-size:.7rem;line-height:14px;text-align:center;animation:ping 1.8s ease-in-out infinite}
@keyframes ping{50%{transform:scale(1.18)}}
.btn:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #1b1440,0 8px 16px #0005;border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:.9rem;border-radius:11px}
.btn.danger{background:linear-gradient(180deg,#ff7f93,#e0405a);color:#fff;box-shadow:0 4px 0 #8f1f36,0 8px 16px #0006}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:800;font-size:.78rem;letter-spacing:.05em;color:#14102c}
.chip.ipa{background:var(--ipa)}.chip.ips{background:var(--ips)}.chip.mtk{background:var(--mtk)}
.muted{color:var(--muted)}
.coins{font-weight:800;color:var(--gold);white-space:nowrap}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar h2{font-size:clamp(1.05rem,4.8vw,1.5rem);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* menu */
.logo{text-align:center;padding:18px 0 6px}
.logo h1{font-size:clamp(2.1rem,8vw,3.6rem);line-height:1;color:var(--gold);text-shadow:0 4px 0 #8a4a12,0 10px 24px #000a}
.logo p{color:var(--muted);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;margin-top:8px}
.hero-row{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:14px}
@media(min-width:760px){.hero-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.profile{display:flex;gap:14px;align-items:center}
.profile .av{width:84px;height:104px;flex:none;background:linear-gradient(180deg,#3d3480,#251d52);border-radius:16px;display:grid;place-items:end center;overflow:hidden}
.profile .av svg{width:76px;height:96px}
.pname{font-family:var(--font-d);font-size:1.4rem;overflow-wrap:anywhere}
.xp{height:12px;border-radius:99px;background:#150f33;overflow:hidden;margin:6px 0 3px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--mana),#8f7bff);border-radius:99px;transition:width .5s}
.menu-btns{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.menu-btns .btn{width:100%;text-align:center}
.menu-btns .wide{grid-column:1/-1;font-size:1.3rem;padding:16px}
.menu-btns .btn:not(.wide){font-size:clamp(.78rem,3.7vw,1rem);padding-inline:8px;white-space:nowrap;gap:6px}
.menu-btns .sm2{font-size:1.05rem;padding:13px}
.menu-btns{margin-top:0}
.menu-stack{display:grid;gap:14px;margin-top:6px}
.menu-stack .stage{margin-top:0}
.hint{text-align:center;margin-top:14px;font-size:.85rem}
.mini-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.mini-stats div{background:#1d1742;border-radius:12px;padding:8px;text-align:center}
.mini-stats b{display:block;font-family:var(--font-d);font-size:1.25rem;font-weight:400;color:var(--gold)}
.mini-stats span{font-size:.72rem;color:var(--muted);font-weight:700}

/* map */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.node{position:relative;border:2px solid var(--line);background:var(--panel);border-radius:18px;padding:12px 10px 10px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.node.open{border-color:var(--gold);box-shadow:0 0 0 3px #ffcf5c22}
.node.locked{opacity:.5}
.node .lv{font-family:var(--font-d);font-size:1.3rem;color:var(--gold)}
.node .thumb{width:84px;height:84px}
.node .thumb svg{width:100%;height:100%}
.node .nm{font-weight:800;font-size:.9rem;overflow-wrap:anywhere}
.node .sub{font-size:.75rem;color:var(--muted);font-weight:700}
.stars{letter-spacing:2px;color:var(--gold);font-size:1.05rem}
.stars .off{color:#4a3f85}
.node .lock{font-size:1.6rem;height:84px;display:grid;place-items:center}

/* battle */
.arena{position:relative;height:clamp(230px,44vw,330px);border-radius:20px;overflow:hidden;border:2px solid var(--line);
  background:linear-gradient(180deg,var(--a,#3a2d78) 0%,var(--b,#1a1438) 70%);isolation:isolate}
.arena::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26%;background:linear-gradient(180deg,#0000,#0007);z-index:0}
.arena .floor{position:absolute;left:-5%;right:-5%;bottom:-8%;height:34%;background:var(--floor,#2a2150);border-radius:50% 50% 0 0/40% 40% 0 0;z-index:0}
.hud{position:absolute;top:10px;z-index:3;width:min(44%,260px)}
.hud.p{left:10px}.hud.m{right:10px;text-align:right}
.hud .nm{font-weight:800;font-size:.85rem;text-shadow:0 2px 4px #000a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp{position:relative;height:18px;border-radius:99px;background:#0e0a24cc;border:2px solid #0008;overflow:hidden}
.hp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#7bf3bd,var(--hpok));transition:width .45s ease,background .3s;border-radius:99px}
.hp.mid i{background:linear-gradient(180deg,#ffe28a,#f5b73b)}
.hp.low i{background:linear-gradient(180deg,#ff8da0,var(--hp))}
.hp span{position:absolute;inset:0;display:grid;place-items:center;font-size:.72rem;font-weight:800;text-shadow:0 1px 2px #000}
.fighter{position:absolute;bottom:6%;z-index:2;transition:filter .2s}
.fighter.p{left:6%;width:clamp(92px,22%,150px)}
.fighter.m{right:6%;width:clamp(110px,28%,190px)}
.fighter.m.boss{width:clamp(150px,38%,260px);right:3%;filter:drop-shadow(0 0 14px var(--aura,#ff5470aa))}
.fighter svg{display:block;width:100%;height:auto;overflow:visible}
.fighter.idle svg{animation:bob 2.2s ease-in-out infinite}
.fighter.m.idle svg{animation-delay:-1s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fighter.atk.p{animation:lungeP .55s ease}
.fighter.atk.m{animation:lungeM .55s ease}
@keyframes lungeP{0%{transform:translateX(0)}40%{transform:translateX(min(46vw,330px)) scale(1.06)}100%{transform:translateX(0)}}
@keyframes lungeM{0%{transform:translateX(0)}40%{transform:translateX(max(-46vw,-330px)) scale(1.06)}100%{transform:translateX(0)}}
.fighter.hit svg{animation:hit .45s ease}
@keyframes hit{0%{transform:translateX(0);filter:none}20%{transform:translateX(-10px);filter:brightness(2.2) saturate(.3)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}100%{transform:translateX(0);filter:none}}
.fighter.dead{animation:die .9s forwards}
@keyframes die{to{opacity:0;transform:translateY(30px) scale(.7) rotate(8deg);filter:grayscale(1)}}
.fighter.enter{animation:enter .6s ease-out}
@keyframes enter{from{opacity:0;transform:translateX(80px) scale(.6)}to{opacity:1;transform:none}}
.fighter.m.boss.enter{animation:bossIn 1.1s cubic-bezier(.2,1.4,.4,1)}
@keyframes bossIn{0%{opacity:0;transform:scale(.1) translateY(-60px);filter:brightness(4)}60%{opacity:1;transform:scale(1.2);filter:brightness(1.8)}100%{transform:none;filter:none}}
.fx{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.dmg{position:absolute;font-family:var(--font-d);font-size:2rem;color:#fff;text-shadow:0 3px 0 #000a,0 0 12px currentColor;animation:floatUp 1s ease-out forwards;white-space:nowrap}
.dmg.pl{color:#ffd166}.dmg.mo{color:#ff6b81}.dmg.heal{color:#4fe3a0}.dmg.crit{font-size:2.8rem;color:#ffee58}
@keyframes floatUp{0%{opacity:0;transform:translateY(10px) scale(.6)}15%{opacity:1;transform:translateY(-6px) scale(1.2)}100%{opacity:0;transform:translateY(-70px) scale(1)}}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--font-d);font-size:clamp(1.4rem,6vw,2.4rem);color:#fff;
  text-shadow:0 3px 0 #000a,0 0 20px #ff5470;white-space:nowrap;animation:banner 1.5s ease forwards;text-align:center}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.slash{position:absolute;width:120px;height:6px;background:linear-gradient(90deg,#0000,#fff,#0000);border-radius:9px;transform:rotate(-35deg);animation:slash .35s ease-out forwards}
@keyframes slash{0%{opacity:0;transform:rotate(-35deg) scaleX(.2)}40%{opacity:1}100%{opacity:0;transform:rotate(-35deg) scaleX(1.4)}}
.arena.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
.arena.flash::before{content:"";position:absolute;inset:0;z-index:4;background:#ff3355;opacity:0;animation:flashr .4s}
@keyframes flashr{0%{opacity:.45}100%{opacity:0}}
.auras{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:6px}
.aura-tag{background:#0009;border:1px solid #fff4;border-radius:99px;padding:2px 9px;font-size:.72rem;font-weight:800}

.timerwrap{display:flex;align-items:center;gap:10px;margin:12px 0 10px}
.timer{flex:1;height:14px;border-radius:99px;background:#120d2c;overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--mana),#8f7bff);border-radius:99px}
.timer.low i{background:linear-gradient(90deg,#ffb347,var(--hp));animation:pulse .6s infinite alternate}
@keyframes pulse{to{filter:brightness(1.5)}}
#tNum{font-family:var(--font-d);font-size:1.5rem;min-width:2.2ch;text-align:right}
#tNum.low{color:var(--hp)}

.qcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:.82rem;font-weight:800;color:var(--muted)}
.qmeta .combo{margin-left:auto;color:var(--gold)}
.qtext{font-size:clamp(1.02rem,3.6vw,1.2rem);font-weight:700;line-height:1.4;margin-bottom:12px;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:minmax(0,1fr);gap:9px}
@media(min-width:720px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:#231b4c;border-radius:14px;padding:11px 12px;font-weight:700;min-width:0;transition:transform .08s,background .15s,border-color .15s}
.opt:hover:not(:disabled){background:#2f2566;border-color:var(--mana)}
.opt:active:not(:disabled){transform:scale(.985)}
.opt b{flex:none;width:30px;height:30px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;font-family:var(--font-d);font-weight:400}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt.correct{background:#16553f;border-color:var(--good)}
.opt.correct b{background:var(--good);color:#073b27}
.opt.wrong{background:#5a1b32;border-color:var(--bad)}
.opt.wrong b{background:var(--bad);color:#4a0c1d}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.expl{margin-top:12px;border-radius:14px;padding:12px;background:#1a1440;border:1px solid var(--line);display:grid;gap:8px}
.expl .eh{font-family:var(--font-d);font-size:1.2rem}
.expl .eh.ok{color:var(--good)}.expl .eh.no{color:var(--bad)}
.skills{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin-top:12px}
.sk{position:relative;border:2px solid var(--line);background:var(--panel2);border-radius:13px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:.66rem;line-height:1.1;text-align:center;min-width:0}
.sk .ic{font-size:1.35rem}
.sk.armed{border-color:var(--gold);background:#4b3a12;box-shadow:0 0 12px #ffcf5c66}
.sk:disabled{opacity:.45;cursor:not-allowed}
.sk .cd{position:absolute;top:2px;right:5px;font-family:var(--font-d);font-size:.9rem;color:var(--gold)}
.sk .lk{font-size:.62rem;color:var(--muted)}
@media(max-width:420px){.skills{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:#0a0720e0;display:grid;place-items:center;padding:16px;overflow:auto;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.modal{width:min(520px,100%);background:linear-gradient(180deg,#352a6c,#241c52);border:2px solid var(--gold);border-radius:22px;padding:20px;text-align:center;display:grid;gap:12px;animation:pop .35s cubic-bezier(.2,1.4,.4,1);max-height:calc(100% - 8px);overflow:auto}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.modal h2{font-size:clamp(2rem,9vw,3rem);color:var(--gold);text-shadow:0 3px 0 #8a4a12}
.modal.lose h2{color:var(--bad);text-shadow:0 3px 0 #5a1020}
.modal.plain{text-align:left}
.modal.plain h2{font-size:1.6rem;text-shadow:none}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat-grid div{background:#1b1542;border-radius:12px;padding:8px 4px}
.stat-grid b{display:block;font-family:var(--font-d);font-weight:400;font-size:1.3rem}
.stat-grid span{font-size:.72rem;color:var(--muted);font-weight:700}
.loot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.loot span{background:#1b1542;border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-weight:800;font-size:.9rem}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:#120d2c;border:2px solid var(--gold);border-radius:14px;padding:10px 16px;font-weight:800;max-width:min(92vw,460px);text-align:center;animation:toast 2.6s forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,16px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* lists: inventory, achievements, shop */
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;font-weight:800}
.tab.on{background:var(--gold);color:#3a1f00;border-color:var(--gold)}
.grid2{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.item{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.item .ico{font-size:2rem;width:46px;text-align:center;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block}
.item .tx small{color:var(--muted);font-weight:600}
.item.eq{border-color:var(--gold)}
.item.done{border-color:var(--good)}
.item.todo{opacity:.65}
.sect{font-family:var(--font-d);font-size:1.15rem;color:var(--gold);margin:16px 0 8px}
.pill{background:#1b1542;border-radius:99px;padding:2px 9px;font-size:.78rem;font-weight:800}
.field{display:grid;gap:6px}
.field label{font-weight:800;color:var(--muted);font-size:.85rem}
.inp{width:100%;border:2px solid var(--line);background:#1b1542;color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;font-weight:700}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #ffffff14}
.switch:last-child{border-bottom:0}
.tg{flex:none;width:54px;height:30px;border-radius:99px;border:2px solid var(--line);background:#1b1542;position:relative;padding:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.tg.on{background:#1d6b4d;border-color:var(--good)}
.tg.on::after{transform:translateX(24px);background:#fff}
.noanim *{animation-duration:.01ms!important;animation-delay:0s!important}
.noanim .dmg,.noanim .banner{animation:none!important;opacity:1}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important}.dmg,.banner{animation:none!important;opacity:1}}
.screen-in{animation:screenIn .28s ease}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}}
.stage{position:relative;height:clamp(120px,26vw,170px);border-radius:20px;overflow:hidden;border:2px solid var(--line);margin-top:6px;
  background:linear-gradient(180deg,#3b2f7a,#15102f 78%)}
.stage::after{content:"";position:absolute;left:-5%;right:-5%;bottom:-30%;height:60%;background:#241b4d;border-radius:50%}
.stage .st{position:absolute;bottom:10%;z-index:1;animation:bob 2.6s ease-in-out infinite}
.stage .st svg{display:block;width:100%;height:auto}
.stage .p{left:8%;width:clamp(54px,12vw,84px)}
.stage .m1{right:30%;width:clamp(50px,11vw,76px);animation-delay:-.8s}

/* ---------- GENERATOR SOAL MATEMATIKA (jawaban benar dihitung otomatis) ---------- */
function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function rp(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function fmt(n) { return String(n).replace("-", "−"); }
function pack(s, g, d, q, correct, cands, e) {
  const seen = new Set([String(correct)]); const w = [];
  for (const c of cands) { const k = String(c); if (!seen.has(k)) { seen.add(k); w.push(c); } if (w.length === 3) break; }
  let t = 1; while (w.length < 3 && t < 50) { const k = String(correct + (t % 2 ? t : -t)); if (!seen.has(k) && typeof correct === "number") { seen.add(k); w.push(correct + (t % 2 ? t : -t)); } t++; }

}

const DROPW = { mon: [70, 24, 6, 0, 0, 0, 0], elite: [0, 0, 74, 26, 0, 0, 0], boss: [0, 0, 0, 72, 22, 6, 0], quest: [0, 55, 33, 10, 2, 0, 0], day7: [30, 40, 25, 5, 0, 0, 0] };
function pickRar(kind, L, luck) {
  const base = DROPW[kind], first = base.findIndex(v => v > 0);
  const w = base.map((v, i) => (!v || i === 6 || RAR[i].minL > L) ? 0 : v * (i > first ? (1 + .05 * (L - 1)) * (1 + (luck || 0) / 200) : 1));
  const tot = w.reduce((a, b) => a + b, 0); if (!tot) return -1;
  let x = Math.random() * tot; for (let i = 0; i < w.length; i++) { if (w[i] && (x -= w[i]) < 0) return i; }
  return w.findIndex(v => v > 0);
}
function pickItem(ri) {

  const pool = nu.length && Math.random() < .9 ? nu : all; return pool[Math.floor(Math.random() * pool.length)];
}

  menu() { G = null; go("menu"); }, map() { G = null; go("map"); },
  lvl(d) { startLevel(+d.l); },
  quest() { go("quest"); }, reward() { go("reward"); },
  claimq(d) { if (claimQuest(d.id)) refresh(); },
  claimbonus() { if (claimBonus()) refresh(); },
  claimr() { if (claimReward()) refresh(); },
  tab(d) { INV_TAB = d.t; refresh(); },
  detail(d) { showItem(d.id); }, rfilter(d) { INV_RAR = d.r; refresh(); }, rsort() { INV_SORT = INV_SORT === "desc" ? "asc" : "desc"; refresh(); }, rvnext() { RV.next && RV.next(); },
  equip(d) { const it = ITEMS[d.id]; if (!it || !P.own[d.id]) return; if ((it.lv || 0) > P.lvl) return toast("Butuh Level " + it.lv + " untuk memakai " + it.n); P.eq[it.t] = d.id; if (P.newi) delete P.newi[d.id]; closeLayer(); save(); refresh(); },
  unequip(d) { P.eq[d.s] = null; closeLayer(); save(); refresh(); },
  use(d) {
    if (d.id === "potion") return toast("Health Potion dipakai saat bertarung, lewat tombol Tas.");
    if ((P.inv[d.id] || 0) < 1) return;
    P.inv[d.id]--; addExp(100, []); checkAch(); save(); toast("EXP +100"); refresh();
  },
  buy(d) {
    const it = ITEMS[d.id]; if (!it || P.coins < it.price || (it.t !== "use" && P.own[d.id])) return;
    P.coins -= it.price; giveItem(d.id); save(); toast("Dibeli: " + it.n); refresh();
  },
  tog(d) { P.set[d.k] = !P.set[d.k]; applySettings(); save(); refresh(); },
  tmode(d) { P.set.timer = +d.v; save(); refresh(); },
  mkcode() {
    const c = makeCode(), t = $("#code"); t.value = c; t.focus(); t.select();
    try { navigator.clipboard.writeText(c).then(() => toast("Kode disalin."), () => toast("Salin kode dari kotak di atas.")); } catch (e) { toast("Salin kode dari kotak di atas."); }
  },
  loadcode() {
    const o = readCode($("#code").value || ""); if (!o) return toast("Kode tidak valid. Periksa apakah tersalin utuh.");
    P = o; save(); applySettings(); toast("Progres dimuat."); go("set");
  },
  login() {
    const v = ($("#acc") || {}).value || ""; if (codeHash(v) !== VIP_HASH) return toast("Kode salah.");
    setAccount("vip"); applySettings(); toast("Login berhasil. Akun VIP aktif."); go("menu");
  },
  logout() { setAccount("main"); applySettings(); toast("Kembali ke akun biasa."); go("menu"); },
  reset() { confirmBox("Reset permainan?", "Semua progres, item, dan achievement akan dihapus.", "resetyes", "Ya, hapus"); },
  resetyes() { P = ACC === "vip" ? vipProfile() : defaultSave(); save(); applySettings(); G = null; go("menu"); toast("Progres direset."); },
  close() { closeLayer(); afterClose(); },
  quit() { pauseTimer(); confirmBox("Keluar dari pertarungan?", "Progres level ini hilang. EXP dan koin yang sudah didapat tetap tersimpan.", "quityes", "Keluar"); },
  quityes() { G = null; go("map"); },
  fight() { closeLayer(); askQuestion(); },
  ans(d) { answer(+d.i); },
  skill(d) { useSkill(d.id); },
  bag() { openBag(); },
  usepotion() { usePotion(); },
  next() { nextAction(); },
  retry() { startLevel(G.L); },
  nextlevel() { startLevel(G.L + 1); },
  tomap() { G = null; go("map"); },
  tomenu() { G = null; go("menu"); }
};
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, () => Music.kick(), { passive: true }));
document.addEventListener("click", e => {
  Music.kick();
  const el = e.target.closest("[data-act]"); if (!el || el.disabled || el.tagName === "INPUT") return;
  const f = ACT[el.dataset.act]; if (f) { SFX.click(); f(el.dataset, el); }
});
document.addEventListener("input", e => {
  const el = e.target, a = el && el.dataset && el.dataset.act; if (!a) return;
  if (a === "musicvol") { P.set.music = +el.value; const l = $("#v_music"); if (l) l.textContent = el.value + "%"; Music.vol(); save(); }
  else if (a === "sfxvol") { P.set.sfx = +el.value; const l = $("#v_sfx"); if (l) l.textContent = el.value + "%"; save(); }
});
document.addEventListener("change", e => {
  const el = e.target; if (el && el.dataset && el.dataset.act === "sfxvol") SFX.click();
  if (el && el.dataset && el.dataset.act === "rename") { P.name = (el.value || "").trim().slice(0, 14) || "Petualang"; save(); toast("Nama disimpan."); }
});
document.addEventListener("keydown", e => {
  const t = e.target;
  if (t && /INPUT|TEXTAREA/.test(t.tagName)) { if (e.key === "Enter" && t.id === "nm0") ACT.begin(); if (e.key === "Enter" && t.id === "acc") ACT.login(); return; }
  if (SCREEN !== "battle" || !G || LAYER().innerHTML) return;
  if (G.phase === "ask") {
    const k = e.key.toLowerCase(), i = k.length === 1 ? ("abcd".indexOf(k) >= 0 ? "abcd".indexOf(k) : "1234".indexOf(k)) : -1;
    if (i >= 0) { const b = document.querySelectorAll(".opt")[i]; if (b && !b.disabled) answer(i); }
  } else if (G.phase === "explain" && e.key === "Enter") { e.preventDefault(); nextAction(); }
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden) Music.pause(); else Music.resume();
  if (!G || SCREEN !== "battle") return;
  if (document.hidden) pauseTimer(); else if (!LAYER().innerHTML) resumeTimer();
});
applySettings();
go("menu");
</script>
